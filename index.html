<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Handball Analyzer">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Handball Analyzer</title>
<style>
  html, body {
    margin: 0; padding: 0;
    height: 100%; background: #000; color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-family: system-ui;
  }
  #loading {font-size: 1.2rem;}
</style>
</head>
<body>
<div id="loading">読み込み中...</div>
<script>
(async ()=>{
  try {
    // あなたのGAS本番URL（/exec）
    const url = "https://script.google.com/macros/s/AKfycbz8cO4bwVOb79ftZa-ZJJy7pq2KGneLZ1DiBzgHZ_auRyX2TQgkDa05JyBFXYKfxsIRRw/exec";
    const res = await fetch(url, {mode: "cors"});
    const html = await res.text();
    document.open();
    document.write(html);
    document.close();
  } catch(e){
    document.body.innerHTML = "<p>⚠️ 読み込みに失敗しました</p>";
  }
})();
</script>
</body>
</html>
